name: release
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
permissions:
  contents: write
concurrency: release
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Check versions and extract notes
        id: version
        run: |
          python - <<'EOF'
          import json, os, re, sys, tomllib
          from pathlib import Path

          version = Path("VERSION").read_text().strip()
          found = {
              "pyproject.toml": tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"],
              ".claude-plugin/plugin.json": json.loads(Path(".claude-plugin/plugin.json").read_text())["version"],
              ".codex-plugin/plugin.json": json.loads(Path(".codex-plugin/plugin.json").read_text())["version"],
          }
          wrong = {path: v for path, v in found.items() if v != version}
          if wrong:
              sys.exit(f"VERSION is {version}, but {wrong}")
          match = re.search(rf"^## {re.escape(version)}\n(.*?)(?=^## |\Z)", Path("CHANGELOG.md").read_text(), re.M | re.S)
          if not match or not match.group(1).strip():
              sys.exit(f"CHANGELOG.md has no '## {version}' section")
          Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(match.group(1).strip() + "\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"version={version}\n")
          EOF
      - name: Tag and publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "lumberjack $VERSION" "$GITHUB_SHA"
          git push origin "$tag"
          gh release create "$tag" --title "lumberjack $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
